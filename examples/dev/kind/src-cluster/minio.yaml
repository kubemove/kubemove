# apiVersion: v1
# kind: Secret
# metadata:
#   name: minio-server-secret
# data:
#   private.key: 
#   public.crt: 
# type: Opaque

# ---
apiVersion: v1
kind: Secret
metadata:
  name: minio-client-secret
data:
  AWS_ACCESS_KEY_ID: bm90QGlk
  AWS_SECRET_ACCESS_KEY: bm90QHNlY3JldA==
  # CA_CERT_DATA: 
type: Opaque

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: minio-server
  name: minio-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-server
spec:
  selector:
    matchLabels:
      app: minio-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio-server
    spec:
      containers:
      - args:
        - server
        # - --address
        # - ":443"
        - /storage
        env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-client-secret
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-client-secret
              key: AWS_SECRET_ACCESS_KEY
        image: minio/minio
        imagePullPolicy: Always
        name: minio-server
        ports:
        - containerPort: 9000
          protocol: TCP
        volumeMounts:
        - mountPath: /storage
          name: minio-storage
        # - mountPath: /root/.minio/certs
        #   name: minio-certs
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc
      # - name: minio-certs
      #   secret:
      #     defaultMode: 420
      #     items:
      #     - key: public.crt
      #       path: public.crt
      #     - key: private.key
      #       path: private.key
      #     - key: public.crt
      #       path: CAs/public.crt
      #     secretName: minio-server-secret
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  ports:
  - port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: minio-server
  type: NodePort