apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig
data:
  config: |
    apiVersion: v1
    clusters:
    - cluster:
        certificate-authority-data: 
        server: https://172.17.0.3:6443
      name: kind-dst-cluster
    - cluster:
        certificate-authority-data: 
        server: https://172.17.0.2:6443
      name: kind-src-cluster
    contexts:
    - context:
        cluster: kind-dst-cluster
        user: kind-dst-cluster
      name: kind-dst-cluster
    - context:
        cluster: kind-src-cluster
        user: kind-src-cluster
      name: kind-src-cluster
    current-context: kind-src-cluster
    kind: Config
    preferences: {}
    users:
    - name: kind-dst-cluster
      user:
        client-certificate-data: 
        client-key-data: 
    - name: kind-src-cluster
      user:
        client-certificate-data: 
        client-key-data: 

---
kind: Pod
apiVersion: v1
metadata:
  name: kubectl
  labels:
    app: kubectl
spec:
  containers:
  - name: kubectl
    image: appscode/golang-dev:1.13.6
    args: ["/bin/sh","-c","sleep 30000"]
    volumeMounts:
      - name: kubeconfig
        mountPath: /.kube
  volumes:
    - name: kubeconfig
      configMap:
        name: kubeconfig
