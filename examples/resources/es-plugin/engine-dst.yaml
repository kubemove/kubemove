apiVersion: kubemove.io/v1alpha1
kind: MoveEngine
metadata:
  name: sample-es-move
spec:
  movePair: cluster1
  namespace: ns1
  remoteNamespace: ns2
  syncPeriod: "30 * * * *"
  plugin: eck-plugin
  selectors:
    matchLabels:
      name: app1
  includeResources: false
  mode: standby
  pluginParameters:
    repository:
      name: minio_repo
      type: s3
      bucket: demo
      prefix: es/backup
      endpoint: 172.17.0.3:32559
      scheme: http
      credentials: minio-credentials
    elasticsearch:
      serviceName: sample-es-es-http
      port: 9200
      namespace: default
      scheme: https
      authSecret: sample-es-es-elastic-user
      tlsSecret: sample-es-es-http-ca-internal
